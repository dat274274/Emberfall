<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calamity Prototype - Warrior Edition</title>
    <style>
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #class-selection {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; backdrop-filter: blur(5px);
        }
        .class-card {
            background: #222; border: 2px solid #555; border-radius: 10px;
            padding: 20px; margin: 10px; width: 200px; text-align: center;
            cursor: pointer; transition: 0.2s;
        }
        .class-card:hover { transform: scale(1.05); border-color: #fff; }
        .class-warrior { border-color: #aaa; }
        .class-warrior:hover { border-color: #fff; box-shadow: 0 0 15px #fff; }
        .class-elemental { border-color: #aa33aa; }
        .class-elemental:hover { border-color: #ff44ff; box-shadow: 0 0 15px #ff44ff; }
        .class-smoke { border-color: #555; }
        .class-smoke:hover { border-color: #aaa; box-shadow: 0 0 15px #aaa; }
        #game-container { display: none; }
        #change-class-btn {
            position: fixed; top: 10px; right: 10px; z-index: 9999;
            background: #222; border: 1px solid #aaa; color: #fff;
            padding: 8px 16px; border-radius: 4px; cursor: pointer; display: none;
        }
        #change-class-btn:hover { background: #444; }
    </style>
    <!-- Nạp thư viện Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
</head>
<body>
    <button id="change-class-btn" onclick="openClassMenu()">Đổi Class / Vũ Khí</button>

    <div id="class-selection">
        <h1 style="margin-bottom: 30px; font-size: 3em; text-transform: uppercase; letter-spacing: 2px;">Chọn Class</h1>
        <div style="display: flex; gap: 20px;">
            <div class="class-card class-warrior" onclick="selectClass('warrior')">
                <h2 style="color: #ccc;">⚔️ Chiến Binh</h2>
                <p style="font-size: 14px; color: #888;">Cận chiến mạnh mẽ. (Chọn kiếm trong menu Admin)</p>
            </div>
            <div class="class-card class-elemental" onclick="selectClass('elemental_mage')">
                <h2 style="color: #ff66ff;">🔥💧 Pháp Sư Nguyên Tố</h2>
                <p style="font-size: 14px; color: #888;">Sử dụng linh hoạt Lửa và Nước.</p>
            </div>
            <div class="class-card class-smoke" onclick="selectClass('smoke_assassin')">
                <h2 style="color: #999;">🌫️ Sát Thủ Khói</h2>
                <p style="font-size: 14px; color: #888;">Ẩn mình và dịch chuyển bằng Khói.</p>
            </div>
        </div>

        <h2 style="margin-top: 40px; color: #aaa;">Chọn Vũ Khí (Chỉ áp dụng cho Chiến Binh)</h2>
        <div style="display: flex; gap: 15px;">
            <button onclick="selectWeapon('common')" style="padding: 10px 20px; background: #444; color: #fff; border: 2px solid #888; border-radius: 5px; cursor: pointer;">Kiếm Thường (Common)</button>
            <button onclick="selectWeapon('uncommon')" style="padding: 10px 20px; background: #224; color: #fff; border: 2px solid #4488ff; border-radius: 5px; cursor: pointer;">Kiếm Hiếm (Uncommon)</button>
            <button onclick="selectWeapon('rare')" style="padding: 10px 20px; background: #422; color: #fff; border: 2px solid #ff4444; border-radius: 5px; cursor: pointer;">Kiếm Truyền Thuyết (Rare)</button>
        </div>
        <p id="weapon-status" style="color: #0f0; margin-top: 10px;"></p>
    </div>

    <div id="game-container"></div>

    <script>
        window.playerClass = localStorage.getItem('calamity_class') || null;
        window.playerWeapon = localStorage.getItem('calamity_weapon') || 'common';
        
        function selectWeapon(wpn) {
            window.playerWeapon = wpn;
            localStorage.setItem('calamity_weapon', wpn);
            document.getElementById('weapon-status').innerText = 'Đã chọn vũ khí: ' + wpn.toUpperCase();
        }

        function selectClass(cls) {
            window.playerClass = cls;
            localStorage.setItem('calamity_class', cls);
            document.getElementById('class-selection').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('change-class-btn').style.display = 'block';
            
            // Reload game to apply class
            if (window.gameStarted) {
                window.location.reload();
            } else {
                window.gameStarted = true;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = './scr/main.js';
                document.body.appendChild(script);
            }
        }

        function openClassMenu() {
            document.getElementById('class-selection').style.display = 'flex';
        }

        // Nếu đã có class thì vào game luôn
        if (window.playerClass) {
            document.getElementById('class-selection').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('change-class-btn').style.display = 'block';
            window.gameStarted = true;
            const script = document.createElement('script');
            script.type = 'module';
            script.src = './scr/main.js';
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
